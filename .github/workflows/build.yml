name: Publish Public APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-public-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify published app files
        run: |
          test -f index.html
          test -f DrSokoWorkout.apk

      - name: Upload public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-soko-workout-public-apk
          path: DrSokoWorkout.apk
